<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="media/favicon.ico" type="image/x-icon" />
    <title>Quadrants</title>
    <link rel="stylesheet" href="./fonts/iconoir/iconoir.css" />
    <link rel="stylesheet" href="./fonts/monoid.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="controls">
      <button id="save-btn" class="btn">Save</button>
      <button id="load-btn" class="btn">Load</button>
      <button id="clear-btn" class="btn">Clear All</button>
      <button id="export-btn" class="btn">Export</button>
      <button id="reload-last-btn" class="btn" style="display: none">
        Reload Last File
      </button>
    </div>

    <div id="main-container">
      <!-- JS will populate this -->
    </div>

    <input
      type="file"
      id="file-input"
      accept=".md,.txt"
      style="display: none"
    />

    <script src="libs/interact.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
